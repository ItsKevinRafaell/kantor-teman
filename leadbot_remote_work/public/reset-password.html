<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - AutoLead</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/brand/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --yellow: #f5a700;
      --charcoal: #242423;
      --snow: #fcfaf7;
      --white: #ffffff;
      --line: #ebe2d4;
      --muted: #756d63;
      --soft-yellow: #fff4d7;
      --success: #21835f;
      --danger: #c94f3d;
      --shadow: 0 24px 70px rgba(36, 36, 35, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--snow);
      color: var(--charcoal);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    .card {
      width: min(100%, 420px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .brand-logo {
      display: block;
      width: 172px;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 650;
    }

    p {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--snow);
      color: var(--charcoal);
      font: inherit;
      outline: none;
      padding: 0 14px;
    }

    input:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 0 4px rgba(245, 167, 0, 0.15);
    }

    button {
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: var(--yellow);
      color: #fff;
      cursor: pointer;
      font: 600 15px "Poppins", sans-serif;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .notice {
      display: none;
      margin-top: 16px;
      border: 1px solid rgba(245, 167, 0, 0.45);
      border-radius: 8px;
      background: var(--soft-yellow);
      color: var(--charcoal);
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice.error {
      border-color: rgba(201, 79, 61, 0.45);
      background: rgba(201, 79, 61, 0.08);
      color: var(--danger);
    }

    .notice.success {
      border-color: rgba(33, 131, 95, 0.45);
      background: rgba(33, 131, 95, 0.08);
      color: var(--success);
    }

    .helper {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
    }

    a {
      color: #9a6a00;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover { color: var(--charcoal); }
  </style>
</head>
<body>
  <main class="card">
    <img class="brand-logo" src="/brand/logo-secondary.png" alt="Teman UMKM Kita">
    <h1>Reset Password</h1>
    <p id="intro">Masukkan email admin AutoLead untuk menerima link reset password.</p>
    <form id="resetForm">
      <div id="emailField">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div id="passwordField" style="display: none;">
        <label for="password">Password Baru</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password">
      </div>
      <button id="submitButton" type="submit">Kirim Link Reset</button>
      <div id="messageBox" class="notice"></div>
      <div class="helper"><a href="/login">Kembali ke login</a></div>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const form = document.getElementById('resetForm');
    const intro = document.getElementById('intro');
    const emailField = document.getElementById('emailField');
    const passwordField = document.getElementById('passwordField');
    const passwordInput = document.getElementById('password');
    const submitButton = document.getElementById('submitButton');
    const messageBox = document.getElementById('messageBox');

    if (token) {
      intro.textContent = 'Masukkan password baru untuk akun AutoLead.';
      emailField.style.display = 'none';
      passwordField.style.display = 'block';
      passwordInput.required = true;
      submitButton.textContent = 'Ganti Password';
    }

    function showMessage(message, kind) {
      messageBox.textContent = message;
      messageBox.className = 'notice ' + kind;
      messageBox.style.display = 'block';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      messageBox.style.display = 'none';
      try {
        const endpoint = token ? '/api/auth/password/reset' : '/api/auth/password/forgot';
        const payload = token
          ? { token, password: passwordInput.value }
          : { email: document.getElementById('email').value };
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Reset password gagal');
        showMessage(token ? 'Password berhasil diganti. Silakan login dengan password baru.' : body.message, 'success');
        if (token) passwordInput.value = '';
      } catch (error) {
        showMessage(error.message || 'Reset password gagal', 'error');
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
